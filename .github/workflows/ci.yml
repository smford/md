name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest ]
        go-version: [ '1.24', '1.25', '1.26' ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Build Binary
        run: go build -v ./cmd/mdee
